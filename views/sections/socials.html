<!-- socials.html — секция «Открыт к сотрудничеству» (главная + обо мне) -->
<section class="section section-socials" id="socials" data-reveal>
  <div class="container section-socials__inner">

    <header class="section-socials__head">
      <div class="badge badge--violet">
        <span class="badge__icon">
          <img src="/assets/img/badges/socials.svg" alt="" width="80" height="80">
        </span>
        <span class="badge__label">Соцсети</span>
      </div>

      <h2 class="section-socials__title">Открыт к сотрудничеству <br>и новым проектам</h2>
    </header>

    <ul class="contact-cards">

      <li>
        <a class="contact-card contact-card--tg" href="https://t.me/folvski" target="_blank" rel="noopener">
          <span class="contact-card__glyph" aria-hidden="true">
            <img src="/assets/img/socials/Telegram.svg" alt="">
          </span>
          <span class="contact-card__go" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <path d="M6 14 14 6M7 6h7v7" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="contact-card__label">Telegram: @folvski</span>
        </a>
      </li>

      <li>
        <a class="contact-card contact-card--ig" href="https://instagram.com/folvski" target="_blank" rel="noopener">
          <span class="contact-card__glyph" aria-hidden="true">
            <img src="/assets/img/socials/Insta.svg" alt="">
          </span>
          <span class="contact-card__go" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <path d="M6 14 14 6M7 6h7v7" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="contact-card__label">Instagram : @folvski</span>
        </a>
      </li>

      <li>
        <!-- href намеренно tel:, а схема viber:// — в data-app: см. js/controllers/deeplink.js -->
        <a class="contact-card contact-card--vb" href="tel:+375297768419"
           data-app="viber://chat?number=375297768419">
          <span class="contact-card__glyph" aria-hidden="true">
            <img src="/assets/img/socials/Viber.svg" alt="">
          </span>
          <span class="contact-card__go" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <path d="M6 14 14 6M7 6h7v7" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="contact-card__label">Viber: +375 (29) 776-84-19</span>
        </a>
      </li>

    </ul>

  </div>
</section>
